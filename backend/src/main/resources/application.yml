spring:
  application:
    name: eventhub-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventhub}
    username: ${DB_USERNAME:eventhub}
    password: ${DB_PASSWORD:eventhub}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true

springdoc:
  swagger-ui.path: /swagger-ui.html
  api-docs.path: /v3/api-docs

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    allow-ephemeral: ${JWT_ALLOW_EPHEMERAL:false}
    access-minutes: 15
    refresh-days: 30
  qr-secret: ${QR_SIGNING_SECRET:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM_EMAIL:EventHub <ingressos@example.com>}
  demo-seed: ${DEMO_SEED:false}

